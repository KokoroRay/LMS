name: Deploy Backend to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/lms-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./lms
          file: ./lms/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DigitalOcean via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }} 
            set -e
            mkdir -p /home/user/app/lms
            cd /home/user/app/lms
            
            docker pull ${{ env.IMAGE_NAME }}:latest
            
            docker network create lms-network >/dev/null 2>&1 || true
            docker volume create app_logs >/dev/null 2>&1 || true
            docker stop lms-springboot >/dev/null 2>&1 || true
            docker rm lms-springboot >/dev/null 2>&1 || true
            
            docker run -d \
              --name lms-springboot \
              --restart unless-stopped \
              --env-file /home/user/app/lms/.env \
              -p 8080:8080 \
              -v app_logs:/app/logs \
              --network lms-network \
              ${{ env.IMAGE_NAME }}:latest