upstream backend {
    server 165.232.174.136:8080;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hocvienit.id.vn www.hocvienit.id.vn;

    # SSL certificates (cấp qua Cloudflare hoặc Let's Encrypt)
    ssl_certificate /etc/ssl/certs/hocvienit.id.vn.crt;
    ssl_certificate_key /etc/ssl/private/hocvienit.id.vn.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;

    # Frontend (Cloudflare Pages)
    location / {
        proxy_pass https://lms-atr.pages.dev;
        proxy_ssl_verify off;
    }

    # Backend API proxy
    location /api/v1/ {
        proxy_pass http://backend/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # WebSocket proxy
    location /ws {
        proxy_pass http://backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # Redirect HTTP to HTTPS
    error_page 497 https://$server_name$request_uri;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name hocvienit.id.vn www.hocvienit.id.vn;
    return 301 https://$server_name$request_uri;
}
