spring:
  application:
    name: base_spring_boot
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://lms-mysql-rds.c3s0g0sm4aop.ap-southeast-1.rds.amazonaws.com:3306/lms-rds?useSSL=true&requireSSL=true&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=CONVERT_TO_NULL}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:300000}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    properties:
      hibernate:
        format_sql: true
        show_sql: ${SPRING_JPA_SHOW_SQL:false}
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 3072MB
      max-request-size: 3072MB
      file-size-threshold: 2KB
      resolve-lazily: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

jwt:
  secret:
    key: ${JWT_SECRET_KEY}
  expired:
    access: ${JWT_EXPIRED_ACCESS:3600000}
  expiration: ${JWT_EXPIRATION:3600000}
  issuer: ${JWT_ISSUER:lms-api}

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME}
  api_key: ${CLOUDINARY_API_KEY}
  api_secret: ${CLOUDINARY_API_SECRET}
  secure: ${CLOUDINARY_SECURE:true}

vnpay:
  tmnCode: ${VNPAY_TMN_CODE}
  hashSecret: ${VNPAY_HASH_SECRET}
  paymentUrl: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  returnUrl: ${VNPAY_RETURN_URL:https://api.hocvienit.id.vn/api/v1/payments/callback-reenroll}
  ipnUrl: ${VNPAY_IPN_URL:https://api.hocvienit.id.vn/api/v1/payments/vnpay-ipn}

frontend:
  url: ${FRONTEND_URL:https://hocvienit.id.vn}

logging:
  level:
    com.ra.base_spring_boot.security: DEBUG
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: always

cors:
  allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:3000,https://api.lms-project.com,https://api.hocvienit.id.vn,https://d-gxvncujeka.execute-api.ap-southeast-1.amazonaws.com,https://hocvienit.id.vn,https://www.hocvienit.id.vn
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
  allowed-headers: ${CORS_ALLOWED_HEADERS:*}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}

r2:
  region: ${R2_REGION:auto}
  account-id: ${R2_ACCOUNT_ID:}
  endpoint: ${R2_ENDPOINT:}
  bucket-name: ${R2_BUCKET_NAME:lms-video}
  upload-folder: ${R2_UPLOAD_FOLDER:uploads/}
  public-base-url: ${R2_PUBLIC_BASE_URL:}
  credentials:
    access-key: ${R2_ACCESS_KEY_ID:}
    secret-key: ${R2_SECRET_ACCESS_KEY:}
